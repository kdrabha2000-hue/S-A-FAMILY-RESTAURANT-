<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Privilege Card - S&A Family Restaurant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0b0d; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #f3f4f6; }
    
    .card-wrap {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(135deg, #1e232a 0%, #12151a 50%, #0d0f12 100%);
      border-radius: 26px;
      border: 2px solid #d4af37;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(212,175,55,0.25);
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
    }

    .card-wrap::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(212,175,55,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(212,175,55,0.25);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .brand-title { color: #f5d77f; font-size: 17px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .brand-sub { color: #9ca3af; font-size: 12px; margin-top: 2px; }
    .chip {
      width: 38px;
      height: 28px;
      background: linear-gradient(135deg, #e6ca65, #997819);
      border-radius: 6px;
      border: 1px solid #ffe885;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .offers-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .offer-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .offer-box h4 { font-size: 11px; color: #d4af37; margin-bottom: 3px; }
    .offer-box p { font-size: 11px; color: #e5e7eb; margin-bottom: 8px; font-weight: bold; }
    .btn-action {
      background: linear-gradient(135deg, #d4af37, #997819);
      color: #0d0f12;
      font-size: 10px;
      font-weight: 800;
      text-decoration: none;
      padding: 5px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .banner-reward {
      display: none;
      background: linear-gradient(90deg, #10b981, #059669);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(16,185,129,0.3);
    }

    .section-label {
      font-size: 11px;
      color: #d4af37;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 14px;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 8px;
      margin-bottom: 22px;
    }
    .coin-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .coin {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #181c22;
      border: 2px dashed rgba(212,175,55,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #9ca3af;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .coin.active {
      background: radial-gradient(circle, #ffe685 10%, #d4af37 60%, #8c6d12 100%);
      border: 2px solid #fff;
      color: #111;
      box-shadow: 0 0 15px rgba(212,175,55,0.7);
      transform: scale(1.08);
    }
    .coin.milestone {
      border: 2px solid #d4af37;
      background: rgba(212,175,55,0.08);
    }
    .coin-tag {
      font-size: 9px;
      font-weight: 700;
      color: #f5d77f;
      margin-top: 5px;
      text-align: center;
      line-height: 1.1;
    }

    .btn-stamp {
      background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #997819 100%);
      color: #0d0f12;
      border: none;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }
    .btn-stamp:active { transform: scale(0.98); }

    .card-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 10px;
      color: #6b7280;
    }
    .reset-link { color: #6b7280; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card-wrap">
    <div class="card-header">
      <div>
        <div class="brand-title">S&A FAMILY RESTAURANT</div>
        <div class="brand-sub">Bengbari • VIP Privilege Pass</div>
      </div>
      <div class="chip"></div>
    </div>

    <!-- 1-Click Action Offers -->
    <div class="offers-section">
      <div class="offer-box">
        <h4>GOOGLE REVIEW</h4>
        <p>₹20 छूट तुरंत</p>
        <a href="https://maps.app.goo.gl/yE4mh8BorbVaPGCL6?g_st=ac" target="_blank" class="btn-action">रिव्यू दें</a>
      </div>
      <div class="offer-box">
        <h4>INSTA FOLLOW</h4>
        <p>₹20 छूट (बिल ₹100+)</p>
        <a href="https://instagram.com" target="_blank" class="btn-action">फॉलो करें</a>
      </div>
    </div>

    <div class="banner-reward" id="rewardBanner"></div>

    <div class="section-label">✦ लॉयल्टी कॉइन्स (न्यूनतम बिल ₹299) ✦</div>

    <!-- 12 Coin Stamp Grid -->
    <div class="coin-grid" id="coinGrid"></div>

    <button class="btn-stamp" onclick="addStamp()">✨ कॉइन पंच करें (स्टाफ केवल)</button>

    <div class="card-footer">
      <span>VIP GUEST PASS</span>
      <span class="reset-link" onclick="resetCard()">कार्ड रीसेट</span>
    </div>
  </div>

  <script>
    const PIN = "1234";
    const TOTAL = 12;
    const rewards = {
      3: { tag: "वेलकम ड्रिंक", icon: "🥤" },
      6: { tag: "₹200 डिश", icon: "🎁" },
      12: { tag: "₹500 दावत", icon: "👑" }
    };

    function getCount() {
      return parseInt(localStorage.getItem('sa_vip_coins') || '0');
    }

    function render() {
      const count = getCount();
      const grid = document.getElementById('coinGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= TOTAL; i++) {
        const slot = document.createElement('div');
        slot.className = 'coin-slot';

        const isMilestone = rewards[i] !== undefined;
        const isActive = i <= count;

        let icon = isActive ? '✓' : (isMilestone ? rewards[i].icon : '#' + i);
        let tagText = isMilestone ? `<span class="coin-tag">${rewards[i].tag}</span>` : '';

        slot.innerHTML = `
          <div class="coin ${isMilestone ? 'milestone' : ''} ${isActive ? 'active' : ''}">
            ${icon}
          </div>
          ${tagText}
        `;
        grid.appendChild(slot);
      }

      const banner = document.getElementById('rewardBanner');
      if (count >= 12) {
        banner.style.display = 'block';
        banner.innerHTML = '👑 12वीं विज़िट पूरी! ₹500 की रॉयल दावत अनलॉक!';
      } else if (count >= 6) {
        banner.style.display = 'block';
        banner.innerHTML = '🎁 बधाई! ₹200 की पसंदीदा डिश मुफ़्त अनलॉक!';
      } else if (count >= 3) {
        banner.style.display = 'block';
        banner.innerHTML = '🥤 बधाई! मुफ़्त वेलकम ड्रिंक / शेक अनलॉक!';
      } else {
        banner.style.display = 'none';
      }
    }

    function addStamp() {
      const p = prompt("स्टाफ सिक्योरिटी पिन दर्ज करें:");
      if (p === PIN) {
        let current = getCount();
        if (current < TOTAL) {
          localStorage.setItem('sa_vip_coins', current + 1);
          render();
        } else {
          alert("12 कॉइन्स पूरे हो चुके हैं! रिवॉर्ड देने के बाद रीसेट करें।");
        }
      } else if (p !== null) {
        alert("गलत पिन!");
      }
    }

    function resetCard() {
      const p = prompt("रीसेट करने के लिए पिन डालें:");
      if (p === PIN) {
        localStorage.setItem('sa_vip_coins', '0');
        render();
      } else if (p !== null) {
        alert("गलत पिन!");
      }
    }

    render();
  </script>
</body>
</html>
