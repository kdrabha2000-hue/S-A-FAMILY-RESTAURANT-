<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&A Restaurant Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { background:#0a0a0a; color:#fff; font-family:sans-serif; margin:0; padding:15px; }
    .header { background:#D32F2F; padding:15px; text-align:center; font-weight:bold; border-radius:10px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
    .order-card { background:#161616; border:1px solid #2a2a2a; border-radius:10px; padding:14px; margin-bottom:15px; }
    .order-card.new { border-color:#D32F2F; box-shadow:0 0 10px rgba(211,47,47,0.5); }
    .status-btn { background:#222; color:#fff; border:1px solid #444; padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; margin-right:5px; margin-top:8px; }
    .status-btn.active { background:#D32F2F; border-color:#D32F2F; font-weight:bold; }
  </style>
</head>
<body>

  <!-- Audio Alert for incoming orders -->
  <audio id="orderAlert" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <div class="header">
    <span>KITCHEN ADMIN DESK</span>
    <button onclick="enableSound()" style="background:#000; color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer;">
      🔔 Sound ON
    </button>
  </div>

  <div id="live-orders-container">Loading orders...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDTFZDBEAXS6hsQ_W5akOMRWiXyZdjkSo",
      authDomain: "kd-ka-khana-ghar-tak.firebaseapp.com",
      databaseURL: "https://kd-ka-khana-ghar-tak-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kd-ka-khana-ghar-tak"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const alertAudio = document.getElementById('orderAlert');

    function enableSound() {
      alertAudio.play().then(() => { alertAudio.pause(); alert("Sound Alerts Active!"); });
    }

    // LISTEN LIVE TO ORDERS
    db.ref('orders').on('value', (snap) => {
      const orders = snap.val();
      const container = document.getElementById('live-orders-container');
      if (!orders) {
        container.innerHTML = "<p style='text-align:center; color:#777;'>No orders yet.</p>";
        return;
      }

      const list = Object.values(orders).reverse();
      
      // Ring sound if new order received
      const hasNewOrder = list.some(o => o.status === 'Received');
      if (hasNewOrder) {
        alertAudio.play().catch(e => console.log("Tap Sound ON button"));
      }

      container.innerHTML = list.map(o => `
        <div class="order-card ${o.status === 'Received' ? 'new' : ''}">
          <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:bold;">
            <span>#${o.orderId} - ${o.customerName}</span>
            <span style="color:#D32F2F;">₹${o.totalBill}</span>
          </div>
          <div style="font-size:12px; color:#aaa; margin:6px 0;">
            📞 <a href="tel:${o.phone}" style="color:#4CAF50; text-decoration:none;">${o.phone}</a><br>
            📍 ${o.address}<br>
            📝 Note: <i>${o.cookingNote || 'None'}</i>
          </div>
          <div style="background:#202020; padding:8px; border-radius:6px; font-size:12px; margin:8px 0;">
            ${o.items.map(i => `<div>• ${i.name} x ${i.qty} (₹${i.price * i.qty})</div>`).join('')}
          </div>
          <div>
            <button class="status-btn ${o.status === 'Received' ? 'active' : ''}" onclick="updateStatus('${o.orderId}', 'Received')">Received</button>
            <button class="status-btn ${o.status === 'Preparing' ? 'active' : ''}" onclick="updateStatus('${o.orderId}', 'Preparing')">Cooking</button>
            <button class="status-btn ${o.status === 'On The Way' ? 'active' : ''}" onclick="updateStatus('${o.orderId}', 'On The Way')">Out for Delivery</button>
            <button class="status-btn ${o.status === 'Delivered' ? 'active' : ''}" onclick="updateStatus('${o.orderId}', 'Delivered')">Delivered</button>
          </div>
        </div>
      `).join('');
    });

    function updateStatus(id, newStatus) {
      db.ref('orders/' + id).update({ status: newStatus });
    }
  </script>
</body>
</html>
