<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&A Kitchen Admin Desk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --primary-red: #D32F2F; --bg-black: #0c0c0c; --card-bg: #181818; --border-color: #262626; --text-gray: #9e9e9e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-black); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; }
    .admin-header { background: var(--primary-red); padding: 12px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .sound-btn { background: #000; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-card span { font-size: 10px; color: var(--text-gray); display: block; }
    .stat-card strong { font-size: 15px; color: #fff; }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; background: var(--card-bg); color: #aaa; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .tab-btn.active { background: var(--primary-red); color: #fff; border-color: var(--primary-red); }
    .order-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .order-card.new-order { border-color: var(--primary-red); box-shadow: 0 0 10px rgba(211, 47, 47, 0.4); }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
    .customer-info { font-size: 11px; color: #bbb; line-height: 1.6; margin-bottom: 8px; }
    .items-box { background: #202020; border-radius: 6px; padding: 8px; font-size: 12px; margin-bottom: 8px; }
    .status-btn-group { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .status-btn { background: #252525; color: #aaa; border: 1px solid #3a3a3a; padding: 6px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .status-btn.active { background: var(--primary-red) !important; color: #fff !important; border-color: var(--primary-red) !important; font-weight: bold; }
    .form-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; margin-bottom: 15px; }
    .input-field { width: 100%; padding: 9px; background: #222; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; margin: 4px 0 10px 0; font-size: 12px; outline: none; }
    .btn-red-full { width: 100%; background: var(--primary-red); color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .menu-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; }
    .stock-badge { padding: 5px 9px; border-radius: 4px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; }
    .icon-action-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 6px 8px; }
    
    /* Edit Modal Overlay */
    .edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; }
    .modal-box { background: #1c1c1c; border: 1px solid var(--primary-red); border-radius: 12px; padding: 18px; width: 90%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
    .img-preview { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-top: 4px; border: 1px solid #444; }
  </style>
</head>
<body>

  <div class="admin-header">
    <span>S&A KITCHEN DESK</span>
    <button id="soundBtn" class="sound-btn" onclick="toggleSoundAlert()">
      🔔 Sound OFF (Tap to ON)
    </button>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <span>TODAY ORDERS</span>
      <strong id="stat-total-orders">0</strong>
    </div>
    <div class="stat-card">
      <span>GROSS REVENUE</span>
      <strong id="stat-total-rev" style="color:var(--primary-red);">₹0</strong>
    </div>
    <div class="stat-card">
      <span>DATA ARCHIVE</span>
      <button onclick="cleanOldOrders()" style="background:#333; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:10px; margin-top:2px; cursor:pointer;">Reset Orders</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-orders-btn" onclick="switchTab('orders')"><i class="fa-solid fa-bell"></i> Live Orders</button>
    <button class="tab-btn" id="tab-menu-btn" onclick="switchTab('menu')"><i class="fa-solid fa-utensils"></i> Menu & Edit</button>
  </div>

  <!-- ORDERS TAB -->
  <div id="tab-orders">
    <div id="live-orders-feed">Connecting to live kitchen feed...</div>
  </div>

  <!-- MENU TAB -->
  <div id="tab-menu" style="display:none;">
    <div class="form-card">
      <strong style="color:var(--primary-red); font-size:12px;">+ ADD NEW DISH</strong>
      <input type="text" id="m-name" class="input-field" placeholder="Dish Name">
      <div style="display:flex; gap:6px;">
        <input type="number" id="m-price" class="input-field" placeholder="Full Price (₹)">
        <input type="number" id="m-half" class="input-field" placeholder="Half Price (Optional)">
      </div>
      <select id="m-cat" class="input-field">
        <option value="Fast Food">Fast Food</option>
        <option value="Rolls">Rolls</option>
        <option value="Main Course">Main Course</option>
        <option value="Drinks">Drinks</option>
      </select>

      <label style="font-size:11px; color:var(--text-gray);">Select Photo from Gallery</label>
      <input type="file" id="m-file" accept="image/*" class="input-field" onchange="previewNewImage(this)">
      <input type="hidden" id="m-img-base64">
      <img id="m-preview" class="img-preview" style="display:none;">

      <button class="btn-red-full" style="margin-top:10px;" onclick="addNewDish()">+ ADD DISH TO LIVE MENU</button>
    </div>

    <strong style="font-size:13px; color:var(--primary-red); display:block; margin: 15px 0 8px;">ALL MENU ITEMS (EDIT / IN-STOCK)</strong>
    <div id="admin-menu-list">Loading items...</div>
  </div>

  <!-- EDIT POPUP MODAL (WITH GALLERY UPLOAD) -->
  <div class="edit-modal" id="editModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <strong style="color:var(--primary-red);"><i class="fa-solid fa-pen-to-square"></i> EDIT DISH DETAILS</strong>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:18px;" onclick="closeEditModal()"></i>
      </div>
      <input type="hidden" id="edit-key">
      
      <label style="font-size:11px; color:var(--text-gray);">Dish Name</label>
      <input type="text" id="edit-name" class="input-field">
      
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label style="font-size:11px; color:var(--text-gray);">Full Price (₹)</label>
          <input type="number" id="edit-price" class="input-field">
        </div>
        <div style="flex:1;">
          <label style="font-size:11px; color:var(--text-gray);">Half Price (₹)</label>
          <input type="number" id="edit-half" class="input-field">
        </div>
      </div>

      <label style="font-size:11px; color:var(--text-gray);">Category</label>
      <select id="edit-cat" class="input-field">
        <option value="Fast Food">Fast Food</option>
        <option value="Rolls">Rolls</option>
        <option value="Main Course">Main Course</option>
        <option value="Drinks">Drinks</option>
      </select>

      <label style="font-size:11px; color:var(--text-gray);">Upload New Photo from Gallery</label>
      <input type="file" id="edit-file" accept="image/*" class="input-field" onchange="previewEditImage(this)">
      <input type="hidden" id="edit-img-base64">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <img id="edit-preview" class="img-preview">
        <span style="font-size:10px; color:#aaa;">Current Photo Preview</span>
      </div>

      <button class="btn-red-full" onclick="saveEditedDish()">SAVE CHANGES</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDTFZDBEAXS6hsQ_W5akOMRWiXyZdjkSo",
      authDomain: "kd-ka-khana-ghar-tak.firebaseapp.com",
      databaseURL: "https://kd-ka-khana-ghar-tak-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kd-ka-khana-ghar-tak"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allOrders = {};
    let currentMenu = {};

    // PERSISTENT SOUND ENGINE (LOCALSTORAGE MEMORY)
    let audioCtx = null;
    let soundEnabled = localStorage.getItem('sa_sound_pref') === 'true';
    let soundLoopInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      updateSoundUI();
    });

    function updateSoundUI() {
      const btn = document.getElementById('soundBtn');
      if (soundEnabled) {
        btn.innerText = "🔔 Sound ACTIVE";
        btn.style.background = "#2e7d32";
      } else {
        btn.innerText = "🔔 Sound OFF (Tap to ON)";
        btn.style.background = "#000";
      }
    }

    function toggleSoundAlert() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      soundEnabled = !soundEnabled;
      localStorage.setItem('sa_sound_pref', soundEnabled);
      updateSoundUI();

      if (soundEnabled) {
        playBeep();
        alert("Sound Active! Naya order aane par bell bajti rahegi jab tak aap Cooking start na karein.");
      } else {
        stopSoundLoop();
      }
    }

    function playBeep() {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      try {
        const now = audioCtx.currentTime;
        [0, 0.25, 0.5].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(950, now + offset);
          gain.gain.setValueAtTime(1, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.2);
        });
      } catch (err) {}
    }

    function startSoundLoop() {
      if (!soundEnabled || soundLoopInterval) return;
      playBeep();
      soundLoopInterval = setInterval(playBeep, 8000);
    }

    function stopSoundLoop() {
      if (soundLoopInterval) {
        clearInterval(soundLoopInterval);
        soundLoopInterval = null;
      }
    }

    function switchTab(t) {
      document.getElementById('tab-orders-btn').classList.toggle('active', t === 'orders');
      document.getElementById('tab-menu-btn').classList.toggle('active', t === 'menu');
      document.getElementById('tab-orders').style.display = t === 'orders' ? 'block' : 'none';
      document.getElementById('tab-menu').style.display = t === 'menu' ? 'block' : 'none';
    }

    // REALTIME LIVE ORDERS DESK
    db.ref('orders').on('value', snap => {
      allOrders = snap.val() || {};
      const container = document.getElementById('live-orders-feed');
      const list = Object.entries(allOrders).map(([k, v]) => ({ k, ...v })).reverse();

      if (!list.length) {
        container.innerHTML = "<p style='color:#777; text-align:center; padding:30px;'>No orders placed yet.</p>";
        stopSoundLoop();
        updateStats([]);
        return;
      }

      const hasUnaccepted = list.some(o => o.status === 'Received');
      if (hasUnaccepted) {
        startSoundLoop();
      } else {
        stopSoundLoop();
      }

      updateStats(list);

      container.innerHTML = list.map(o => {
        const isReceived = o.status === 'Received';
        const orderIdentifier = o.orderId || o.k;

        return `
          <div class="order-card ${isReceived ? 'new-order' : ''}">
            <div class="order-header">
              <span>#${orderIdentifier} - ${o.customerName || 'Customer'}</span>
              <span style="color:var(--primary-red);">₹${o.totalBill || 0}</span>
            </div>

            <div class="customer-info">
              📞 <b>${o.phone || 'No Phone'}</b><br>
              📍 ${o.address || 'No Address'}<br>
              📝 <i>Special Note: ${o.cookingNote || 'None'}</i>
            </div>

            <div class="items-box">
              ${(o.items || []).map(i => `<div>• <b>${i.name}</b> x ${i.qty} — ₹${(i.price||0) * i.qty}</div>`).join('')}
            </div>

            <div class="status-btn-group">
              <button class="status-btn ${o.status === 'Received' ? 'active' : ''}" onclick="updateOrderStatus('${o.k}', '${orderIdentifier}', 'Received')">Received</button>
              <button class="status-btn ${o.status === 'Preparing' ? 'active' : ''}" onclick="updateOrderStatus('${o.k}', '${orderIdentifier}', 'Preparing')">Cooking</button>
              <button class="status-btn ${o.status === 'On The Way' ? 'active' : ''}" onclick="updateOrderStatus('${o.k}', '${orderIdentifier}', 'On The Way')">Out for Delivery</button>
              <button class="status-btn ${o.status === 'Delivered' ? 'active' : ''}" onclick="updateOrderStatus('${o.k}', '${orderIdentifier}', 'Delivered')">Delivered</button>
            </div>
          </div>
        `;
      }).join('');
    });

    // INSTANT STATUS UPDATE (COLOUR + CUSTOMER TRACKER SYNC)
    window.updateOrderStatus = function(key, orderId, newStatus) {
      const updates = {};
      updates['orders/' + key + '/status'] = newStatus;
      if (orderId && orderId !== key) {
        updates['orders/' + orderId + '/status'] = newStatus;
      }
      db.ref().update(updates).then(() => {
        if (newStatus !== 'Received') stopSoundLoop();
      });
    };

    function updateStats(list) {
      document.getElementById('stat-total-orders').innerText = list.length;
      const totalRev = list.reduce((sum, o) => sum + (parseFloat(o.totalBill) || 0), 0);
      document.getElementById('stat-total-rev').innerText = "₹" + totalRev;
    }

    function cleanOldOrders() {
      if (confirm("Reset today's orders?")) {
        db.ref('orders').remove();
      }
    }

    // ==========================================
    // MENU & EDIT ENGINE WITH GALLERY UPLOAD
    // ==========================================
    db.ref('restaurant_menu').on('value', snap => {
      currentMenu = snap.val() || {};
      const container = document.getElementById('admin-menu-list');
      const items = Object.entries(currentMenu);

      if (!items.length) {
        container.innerHTML = "<p style='color:#777;'>No dishes in menu.</p>";
        return;
      }

      container.innerHTML = items.map(([k, v]) => `
        <div class="menu-row">
          <div style="display:flex; align-items:center; gap:8px;">
            <img src="${v.img || 'https://images.unsplash.com/photo-1562967914-608f82629710?w=200'}" style="width:36px; height:36px; border-radius:6px; object-fit:cover;">
            <div>
              <strong>${v.name}</strong> - ₹${v.price} ${v.hasVariant ? `<small style="color:#aaa;">(Half: ₹${v.halfPrice})</small>` : ''}
              <div style="font-size:10px; color:#888;">${v.category || 'General'}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="stock-badge" style="background:${v.inStock !== false ? '#2e7d32' : '#c62828'}; color:#fff;" onclick="toggleStock('${k}', ${v.inStock === false})">
              ${v.inStock !== false ? 'In Stock' : 'Out'}
            </button>
            <button class="icon-action-btn" style="color:#0288D1;" onclick="openEditModalSafe('${k}')" title="Edit Item">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="icon-action-btn" style="color:#c62828;" onclick="deleteDish('${k}')" title="Delete Item">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    });

    // Gallery Image to Base64 Compressor
    function processImageFile(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 300;
          let w = img.width;
          let h = img.height;
          if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
          else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.previewNewImage = function(input) {
      if (input.files && input.files[0]) {
        processImageFile(input.files[0], function(base64) {
          document.getElementById('m-img-base64').value = base64;
          const prev = document.getElementById('m-preview');
          prev.src = base64;
          prev.style.display = 'block';
        });
      }
    };

    window.previewEditImage = function(input) {
      if (input.files && input.files[0]) {
        processImageFile(input.files[0], function(base64) {
          document.getElementById('edit-img-base64').value = base64;
          document.getElementById('edit-preview').src = base64;
        });
      }
    };

    window.openEditModalSafe = function(key) {
      const item = currentMenu[key];
      if (!item) return;

      document.getElementById('edit-key').value = key;
      document.getElementById('edit-name').value = item.name || '';
      document.getElementById('edit-price').value = item.price || '';
      document.getElementById('edit-half').value = item.halfPrice || '';
      document.getElementById('edit-cat').value = item.category || 'Fast Food';
      document.getElementById('edit-img-base64').value = item.img || '';
      document.getElementById('edit-preview').src = item.img || 'https://images.unsplash.com/photo-1562967914-608f82629710?w=200';
      document.getElementById('edit-file').value = "";

      document.getElementById('editModal').style.display = 'flex';
    };

    window.closeEditModal = function() {
      document.getElementById('editModal').style.display = 'none';
    };

    window.saveEditedDish = function() {
      const key = document.getElementById('edit-key').value;
      const name = document.getElementById('edit-name').value.trim();
      const price = parseFloat(document.getElementById('edit-price').value);
      const halfPrice = parseFloat(document.getElementById('edit-half').value) || null;
      const category = document.getElementById('edit-cat').value;
      const img = document.getElementById('edit-img-base64').value;

      if (!name || isNaN(price)) {
        alert("Naam aur Price daalna zaroori hai!");
        return;
      }

      db.ref('restaurant_menu/' + key).update({
        name,
        price,
        halfPrice,
        hasVariant: !!halfPrice,
        category,
        img
      }).then(() => {
        closeEditModal();
        alert("Dish photo aur details live update ho gayi!");
      });
    };

    window.toggleStock = function(key, newStatus) {
      db.ref('restaurant_menu/' + key).update({ inStock: newStatus });
    };

    window.deleteDish = function(key) {
      if (confirm("Delete this dish?")) db.ref('restaurant_menu/' + key).remove();
    };

    window.addNewDish = function() {
      const name = document.getElementById('m-name').value.trim();
      const price = parseFloat(document.getElementById('m-price').value);
      const halfPrice = parseFloat(document.getElementById('m-half').value) || null;
      const category = document.getElementById('m-cat').value;
      const img = document.getElementById('m-img-base64').value || 'https://images.unsplash.com/photo-1562967914-608f82629710?w=200';

      if (!name || isNaN(price)) { alert("Enter Name & Price"); return; }
      db.ref('restaurant_menu').push({
        name, price, halfPrice, hasVariant: !!halfPrice, category, img, inStock: true
      }).then(() => {
        alert("New Dish Added from Gallery!");
        document.getElementById('m-name').value = '';
        document.getElementById('m-price').value = '';
        document.getElementById('m-half').value = '';
        document.getElementById('m-file').value = '';
        document.getElementById('m-preview').style.display = 'none';
      });
    };
  </script>
</body>
</html>
