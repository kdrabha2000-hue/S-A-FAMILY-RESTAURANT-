<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&A Family Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <h1>S&A FAMILY RESTAURANT</h1>
        <div id="user-profile-bar">
            <button id="login-btn" onclick="openLoginModal()">Login / Register</button>
            <span id="user-name-display" class="hidden"></span>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <button onclick="switchTab('home')">Home</button>
        <button onclick="switchTab('menu')">Menu</button>
        <button onclick="switchTab('cart')">Cart (<span id="cart-count">0</span>)</button>
        <button onclick="switchTab('tracking')">Track Order</button>
    </nav>

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Login Required</h3>
            <p>Order karne ke liye login karein</p>
            <input type="email" id="login-email" placeholder="Email ID">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="loginUser()">Login</button>
            <button onclick="registerUser()">New User? Register</button>
            <button onclick="closeLoginModal()" class="close-btn">Close</button>
        </div>
    </div>

    <!-- TRACK ORDER SCREEN -->
    <section id="screen-tracking" class="screen hidden">
        <h2>Your Live Orders</h2>
        <div id="orders-tracker-list">
            <!-- Dynamic Real-time Status Progress Bar -->
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
