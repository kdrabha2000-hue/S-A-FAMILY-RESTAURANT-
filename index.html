<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&A Family Restaurant</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <h1>🍽️ S&A Family Restaurant</h1>
        <p>Fresh Food • Fast Delivery</p>
    </div>

    <input
        type="text"
        id="search"
        placeholder="🔍 Search your favourite food..."
        onkeyup="searchFood()">
</header>

<section class="banner">
    <h2>Delicious Food Delivered Fast 🚀</h2>
    <p>Flat 10% OFF on First Order</p>
</section>

<section class="category">
    <button>🍗 Biryani</button>
    <button>🥗 Veg</button>
    <button>🍜 Chinese</button>
    <button>🥤 Drinks</button>
</section>

<main id="menu">

<div class="food-card">
    <img src="https://images.unsplash.com/photo-1563379091339-03246963d29a?w=500" alt="Chicken Biryani">
    <h2>Chicken Biryani</h2>
    <p>₹180</p>
    <button onclick="addToCart('Chicken Biryani')">Add to Cart</button>
</div>

<div class="food-card">
    <img src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=500" alt="Veg Thali">
    <h2>Veg Thali</h2>
    <p>₹120</p>
    <button onclick="addToCart('Veg Thali')">Add to Cart</button>
</div>

<div class="food-card">
    <img src="https://images.unsplash.com/photo-1512058564366-18510be2db19?w=500" alt="Fried Rice">
    <h2>Fried Rice</h2>
    <p>₹100</p>
    <button onclick="addToCart('Fried Rice')">Add to Cart</button>
</div>

<div id="cart">
    <h2>🛒 Your Cart</h2>
    <p>No items added.</p>
</div>

</main>

<script src="app.js"></script>

</body>
</html>
