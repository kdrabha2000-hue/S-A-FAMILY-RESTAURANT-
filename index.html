<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&A FAMILY RESTAURANT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Screens will render dynamically here -->
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="switchTab('menu')">
      <i class="fa-solid fa-utensils"></i>
      <span>Menu</span>
    </button>
    <button class="nav-item" onclick="switchTab('cart')">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-badge" id="cart-badge">0</span>
      <span>Cart</span>
    </button>
    <button class="nav-item" onclick="switchTab('orders')">
      <i class="fa-solid fa-clipboard-list"></i>
      <span>Orders</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile')">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
