<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&A Family Restaurant</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>🍽️ S&A Family Restaurant</h1>
  <p>Fresh Food • Fast Delivery • Order Online</p>

  <input
    type="text"
    id="search"
    placeholder="🔍 Search Food..."
    onkeyup="searchFood()">
</header>

<section class="category">
  <button>Biryani</button>
  <button>Rolls</button>
  <button>Momos</button>
  <button>Drinks</button>
</section>

<main id="menu">

<div class="food-card">
<h2>Chicken Biryani</h2>
<p>₹180</p>
<button onclick="addToCart('Chicken Biryani')">Add to Cart</button>
</div>

<div class="food-card">
<h2>Veg Thali</h2>
<p>₹120</p>
<button onclick="addToCart('Veg Thali')">Add to Cart</button>
</div>

<div class="food-card">
<h2>Fried Rice</h2>
<p>₹100</p>
<button onclick="addToCart('Fried Rice')">Add to Cart</button>
</div>

<div class="food-card">
<h2>Chicken Roll</h2>
<p>₹90</p>
<button onclick="addToCart('Chicken Roll')">Add to Cart</button>
</div>

<div class="food-card">
<h2>Veg Roll</h2>
<p>₹50</p>
<button onclick="addToCart('Veg Roll')">Add to Cart</button>
</div>

<div id="cart">
<h2>🛒 Your Cart</h2>
<p><ul id="cart-items"></ul>.</p>
</div>

<script src="app.js"></script>

</main>

</body>
</html>
