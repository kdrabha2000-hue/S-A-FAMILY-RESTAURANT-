<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&A FAMILY RESTAURANT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Firebase CDN (v8 Compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="logo-title">S&A FAMILY RESTAURANT</div>
  </header>

  <!-- Main Container -->
  <main id="app-container" class="main-content">
    <!-- Dynamic Content Will Load Here -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="switchTab('menu')">
      <i class="fa-solid fa-utensils"></i>
      <span>Menu</span>
    </button>
    <button class="nav-item" onclick="switchTab('cart')">
      <div class="cart-icon-wrapper">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-badge" class="badge">0</span>
      </div>
      <span>Cart</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile')">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
