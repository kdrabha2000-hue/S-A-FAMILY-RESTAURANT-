<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>S&A Family Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>S&A FAMILY RESTAURANT</h1>
        <button id="user-btn" onclick="checkAuth()">Login</button>
    </header>

    <div id="screen-home" class="screen active">
        <h2>Popular Items</h2>
        <div id="menu-items"></div>
    </div>

    <div id="screen-cart" class="screen">
        <h2>Your Cart</h2>
        <div id="cart-list"></div>
        <button onclick="handleCheckout()">PROCEED TO CHECKOUT</button>
    </div>

    <nav class="bottom-nav">
        <button onclick="switchTab('home')">Home</button>
        <button onclick="switchTab('cart')">Cart</button>
        <button onclick="switchTab('tracking')">Track Order</button>
    </nav>
    <script src="app.js"></script>
</body>
</html>
