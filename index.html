<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&A Family Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="brand-title">
            <h1>S&A <span>FAMILY RESTAURANT</span></h1>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="container">
        <!-- JS se screens yahan render hongi -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchTab('menu', this)">
            <i class="fa-solid fa-utensils"></i>
            <span>Menu</span>
        </button>
        <button class="nav-item" onclick="switchTab('cart', this)">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </button>
        <button class="nav-item" onclick="switchTab('orders', this)">
            <i class="fa-solid fa-receipt"></i>
            <span>Orders</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
