<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&A Family Restaurant App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="brand-title">
            <i class="fa-solid fa-utensils logo-icon"></i>
            <div>
                <h1>S&A <span>FAMILY RESTAURANT</span></h1>
                <p class="tagline">Freshly Made, Especially for You</p>
            </div>
        </div>
        <div class="top-info-bar">
            <span><i class="fa-solid fa-location-dot"></i> U.T. Road, Bengbari, Udalguri</span>
            <span><i class="fa-solid fa-clock"></i> 8:00 AM - 9:30 PM</span>
        </div>
    </header>

    <!-- Main Screens View -->
    <main id="app-container" class="container">
        <!-- Screens render here dynamically -->
    </main>

    <!-- Bottom App Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchTab('menu', this)">
            <i class="fa-solid fa-utensils"></i>
            <span>Menu</span>
        </button>
        <button class="nav-item" onclick="switchTab('cart', this)">
            <div class="icon-wrap">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-badge" class="badge">0</span>
            </div>
            <span>Cart</span>
        </button>
        <button class="nav-item" onclick="switchTab('orders', this)">
            <i class="fa-solid fa-receipt"></i>
            <span>Orders</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
